# Local development stack: PostgreSQL 16 + Redis 7 (+ the API if you want it containerised).
#   docker compose up -d db redis        → then run the API with `npm run dev` inside server/
#   docker compose up -d                 → everything, API on http://localhost:4000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: saanvi
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./server
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgresql://postgres:devpass@db:5432/saanvi?schema=public&connection_limit=10
      DIRECT_URL: postgresql://postgres:devpass@db:5432/saanvi?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    ports: ["4000:4000"]
volumes:
  pgdata:
